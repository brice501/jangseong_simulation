# Netlify 설정 — 정적 사이트 배포
# 루트("/")로 접속하면 멘토링 게임(mentoring_edition_v2.html)을 보여준다.
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/"
  to = "/mentoring_edition_v2.html"
  status = 200

