<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연세대학교 · 스무살 멘토링 게임</title>
<style>
  :root{
    --pink:#ff7eb3; --pink-d:#ff4f8b; --cream:#fff6fb; --ink:#3a2b39;
    --navy:#003876; --shadow:0 10px 30px rgba(255,79,139,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#ffe3f1,#ffeede);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
  #app{width:100%;max-width:960px;height:min(92vh,720px);background:var(--cream);border-radius:24px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;animation:fade .4s ease}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;background:linear-gradient(90deg,var(--pink),var(--pink-d));
    color:#fff;padding:13px 26px;border-radius:40px;font-size:15px;box-shadow:var(--shadow);transition:transform .12s}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:#fff;color:var(--pink-d);border:2px solid var(--pink)}
  .btn.navy{background:linear-gradient(90deg,#3a6fd8,var(--navy))}
  .btn.small{padding:9px 16px;font-size:13px}

  /* TITLE */
  #title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,#fff,#ffe3f1 70%)}
  #title .heart{font-size:52px;animation:beat 1.2s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  #title h1{font-size:clamp(26px,5vw,42px);margin:.1em 0;font-weight:900;letter-spacing:-1px;
    background:linear-gradient(90deg,var(--pink-d),#ff9a5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  #title .sub{color:#a06;opacity:.85;margin:.2em 0 1.4em;font-size:14px;line-height:1.6}
  #title .badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid rgba(0,56,118,.15);
    border-radius:999px;padding:6px 14px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,38,84,.1)}
  #title .badge img{width:26px;height:26px;border-radius:50%;object-fit:contain}
  #title .badge b{color:var(--navy);font-size:13px}
  .title-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  /* MAIN */
  #main{background:linear-gradient(180deg,rgba(255,255,255,.48) 0%,rgba(255,247,251,.55) 52%,rgba(255,246,251,.9) 100%),
    url("assets/backgrounds/yonsei_main.png") center/cover no-repeat}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;z-index:3;gap:8px}
  .brand{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.9);border:1.5px solid rgba(0,56,118,.16);
    border-radius:999px;padding:6px 13px;box-shadow:0 8px 22px rgba(0,38,84,.12)}
  .brand img{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#fff}
  .brand .t{display:flex;flex-direction:column;line-height:1.05}
  .brand .t b{color:var(--navy);font-size:14px}
  .brand .t span{color:#49627e;font-size:9px;font-weight:800;letter-spacing:.05em}
  .consensus{background:rgba(255,255,255,.92);border-radius:14px;padding:6px 12px;font-size:12px;font-weight:800;color:var(--navy);
    box-shadow:0 6px 16px rgba(0,38,84,.1);min-width:150px}
  .consensus .bar{height:8px;background:#dfe8f5;border-radius:6px;overflow:hidden;margin-top:3px}
  .consensus .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fa8ff,var(--navy));transition:width .6s}
  .roster{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:64px 100px 78px 20px;overflow:hidden}
  .char{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .18s;position:relative}
  .char:hover{transform:translateY(-8px)}
  .char img,.char svg{width:100%;height:auto;max-height:430px;object-fit:contain;filter:drop-shadow(0 14px 16px rgba(0,0,0,.16))}
  .char .name{font-weight:900;margin-top:3px;font-size:14px;color:#2d2430;text-shadow:0 1px 0 rgba(255,255,255,.9)}
  .char .tag{font-size:10px;color:#885b7a;margin-bottom:4px;font-weight:800}
  .aff{width:86%;height:11px;background:#ffdfec;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.65)}
  .aff>i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#ff9ec4,var(--pink-d));transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .aff-num{font-size:10px;color:var(--pink-d);font-weight:800;margin-top:2px}
  .fab{position:absolute;right:16px;bottom:14px;display:flex;flex-direction:column;gap:9px;z-index:4}

  /* MODAL */
  .overlay{position:absolute;inset:0;background:rgba(58,43,57,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .overlay.active{display:flex;animation:fade .25s}
  .panel{background:#fff;width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  .panel h2{margin:.1em 0 .5em;color:var(--pink-d)}
  .x{float:right;border:none;background:#ffe3f1;color:var(--pink-d);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;font-weight:800}
  .stat-card{display:flex;gap:14px;background:#fff6fb;border:1.5px solid #ffe0ee;border-radius:16px;padding:12px;margin-bottom:12px}
  .stat-card img{width:92px;max-height:150px;height:auto;flex-shrink:0;object-fit:contain}
  .stat-card .info{font-size:13px;line-height:1.55}
  .stat-card .info b{color:var(--pink-d)}
  .mbti{display:inline-block;background:var(--pink);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;margin-left:6px}

  .qlist{display:grid;gap:10px}
  .qitem{display:flex;align-items:center;gap:12px;background:#fff6fb;border:1.5px solid #ffe0ee;border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s}
  .qitem:hover{background:#ffe9f4;transform:translateX(4px)}
  .qitem .ico{font-size:24px}
  .qitem .qt{font-weight:800;font-size:15px}
  .qitem .qd{font-size:12px;color:#a07}
  .qitem.done{opacity:.5}
  .qitem.done::after{content:'합의 완료 ✓';margin-left:auto;color:#7bbf6a;font-weight:800;font-size:12px}
  .qitem.lock{opacity:.42;cursor:not-allowed}

  /* PERSPECTIVE CARDS */
  .pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pcard{background:linear-gradient(160deg,#fff6fb,#eef4ff);border:1.5px solid #e3d6ef;border-radius:14px;padding:12px}
  .pcard b{color:var(--navy)}
  .pcard span{font-size:12px;color:#6a5}
  .pcard p{font-size:12.5px;color:#5a4a55;margin:4px 0 0;line-height:1.5}

  /* QUEST PLAY */
  #play{background:linear-gradient(160deg,#cfe8ff,#ffe9f4)}
  .stage{flex:1;position:relative;overflow:hidden}
  .bg-illus{position:absolute;inset:0;z-index:0}
  .bg-illus img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;opacity:.82}
  .bg-illus.grad-intro{background:radial-gradient(circle at 50% 25%,#3a4a7a,#171a2e 75%)}
  .bg-illus.grad-home{background:linear-gradient(180deg,#ffe9d6,#ffd9e6)}
  .bg-illus::after{content:"";position:absolute;inset:0;background:rgba(255,252,254,.16);pointer-events:none}
  .bg-illus.grad-intro::after{background:transparent}
  .scene-chars{position:absolute;bottom:236px;left:0;right:0;display:flex;justify-content:center;gap:2%;z-index:1;padding:0 4%;transition:.3s}
  .scene-chars .char{max-width:140px}
  .scene-chars .char img,.scene-chars .char svg{max-height:320px}
  .scene-chars .char.dim{opacity:.32;filter:grayscale(.4)}
  .scene-chars .char .name{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .solo{position:absolute;bottom:150px;left:0;right:0;display:flex;justify-content:center;z-index:1}
  .solo svg{height:min(46vh,320px);width:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
  .qhead{position:absolute;top:12px;left:14px;z-index:5;background:rgba(255,255,255,.92);border-radius:30px;padding:6px 15px;font-weight:800;color:var(--pink-d);font-size:13px}
  .discuss{position:absolute;top:12px;right:14px;z-index:5;background:rgba(0,56,118,.92);color:#fff;border-radius:14px;padding:8px 13px;font-size:12px;font-weight:700;max-width:52%;line-height:1.4}
  .discuss b{display:block;font-size:10px;opacity:.8;letter-spacing:.05em;margin-bottom:2px}
  .dialog{position:absolute;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.96);border-top:3px solid var(--pink);padding:15px 20px 16px;min-height:150px}
  .dialog .who{font-weight:900;color:var(--pink-d);margin-bottom:4px}
  .dialog .line{font-size:15px;line-height:1.6;min-height:46px}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:9px}
  .choice{text-align:left;background:#fff6fb;border:1.5px solid #ffcfe4;border-radius:12px;padding:11px 14px;cursor:pointer;font-family:inherit;font-size:14px;transition:.15s}
  .choice:hover{background:#ffe3f1;border-color:var(--pink)}
  .choice b{color:var(--navy)}
  .vote{margin-top:8px;background:#eef4ff;border:1.5px solid #cfe0ff;border-radius:12px;padding:10px 13px;font-size:13px;color:var(--navy)}
  .vote .dots{font-size:17px;letter-spacing:2px;margin-top:3px}
  .narration{position:absolute;inset:0;z-index:6;background:radial-gradient(circle at 50% 28%,#303654,#05060b 78%);
    display:none;align-items:center;justify-content:center;text-align:center;padding:28px}
  .narration.active{display:flex}
  .narration .inner{max-width:560px;color:#fff}
  .narration .inner svg{height:min(42vh,300px);width:auto;margin-bottom:18px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
  .narration .txt{font-size:20px;line-height:1.8;font-weight:800;white-space:pre-line;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .narration .hint{margin-top:14px;font-size:12px;color:#cbd4ff;font-weight:700}
  .char.mood-shy img{filter:drop-shadow(0 14px 16px rgba(0,0,0,.16)) saturate(1.12) brightness(1.04)}
  .char.mood-serious img{filter:drop-shadow(0 14px 16px rgba(0,0,0,.16)) contrast(1.08) saturate(.94)}
  .char.mood-smile img{filter:drop-shadow(0 14px 16px rgba(0,0,0,.16)) brightness(1.06)}
  .char.mood-worry img{filter:drop-shadow(0 14px 16px rgba(0,0,0,.16)) saturate(.88)}
  .mood-chip{position:absolute;top:6px;right:4px;background:rgba(255,255,255,.92);border:1.5px solid #ffd7e8;
    border-radius:999px;padding:3px 8px;font-size:11px;font-weight:900;color:var(--pink-d);box-shadow:0 6px 14px rgba(0,0,0,.1)}
  .lineup{display:grid;grid-template-columns:80px 1fr;gap:7px;margin-top:8px;font-size:12px}
  .lineup div{background:#fff;border:1px solid #ffd7e8;border-radius:10px;padding:7px 9px}

  /* ENDING */
  #ending{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,230,244,.78)),url("assets/backgrounds/yonsei_confession.png") center/cover no-repeat;
    align-items:center;justify-content:flex-end;text-align:center;padding:22px;overflow:hidden}
  .ending-scene{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
  .ending-scene img{height:80%;max-height:580px;width:auto;object-fit:contain;filter:drop-shadow(0 16px 20px rgba(0,0,0,.22))}
  .speech{position:absolute;top:40px;left:50%;transform:translateX(-50%);max-width:520px;background:rgba(255,255,255,.96);border:3px solid var(--pink);
    border-radius:24px;padding:16px 20px;color:#5a2444;font-size:17px;line-height:1.6;font-weight:800;box-shadow:var(--shadow)}
  .speech .tag{display:block;font-size:12px;color:var(--navy);margin-bottom:6px;font-weight:800}
  #ending .who{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.45)}
  #ending .end-actions{position:absolute;bottom:20px;left:0;right:0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .fall{position:absolute;top:-30px;font-size:22px;animation:fall linear infinite;z-index:0}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

  .toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1;top:70px}
  @media(max-width:560px){.char .tag{display:none}.stat-card{flex-direction:column;align-items:center;text-align:center}.pcards{grid-template-columns:1fr}.consensus{min-width:120px}}
  @media(max-width:700px), (orientation:portrait){
    body{padding:0;overflow:hidden}
    #app{width:100vw;height:100vh;max-width:none;border-radius:0}
    #main{background:
      linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,247,251,.58) 54%,rgba(255,246,251,.94) 100%),
      url("assets/backgrounds/yonsei_main.png") center top/cover no-repeat}
    .topbar{padding:14px 10px;align-items:flex-start;gap:6px}
    .brand{padding:7px 9px;gap:7px;max-width:220px}
    .brand img{width:30px;height:30px;flex:0 0 auto}
    .brand .t b{font-size:13px}
    .brand .t span{font-size:8px;line-height:1.05}
    .consensus{position:absolute;left:14px;top:62px;width:180px;min-width:0;padding:7px 10px;font-size:11px}
    .topbar .btn.small{display:none}
    .roster{
      position:absolute;left:0;right:0;top:112px;bottom:106px;
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));
      gap:0;padding:0 6px;align-items:end;justify-items:center;overflow:hidden;
    }
    .roster .char{width:100%;max-width:118px;min-width:0}
    .roster .char:nth-child(odd){transform:translateX(8px)}
    .roster .char:nth-child(even){transform:translateX(-42px)}
    .roster .char:hover:nth-child(odd){transform:translateX(8px)}
    .roster .char:hover:nth-child(even){transform:translateX(-42px)}
    .char:hover{transform:none}
    .char img,.char svg{max-height:24vh;width:auto;max-width:100%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.16))}
    .char .name{font-size:13px;margin-top:1px}
    .char .tag{display:block;font-size:10px;margin-bottom:3px}
    .aff{width:74%;height:10px}
    .aff-num{font-size:10px}
    .mood-chip{top:0;right:0;font-size:10px;padding:2px 7px}
    .fab{left:10px;right:auto;bottom:16px;width:370px;max-width:calc(100% - 20px);
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .fab .btn{padding:12px 4px;font-size:12px;min-width:0;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .overlay{padding:10px}.panel{max-height:92vh;border-radius:18px;padding:18px}
    .scene-chars{bottom:250px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 8px;align-items:end}
    .scene-chars .char{max-width:92px}
    .scene-chars .char img,.scene-chars .char svg{max-height:25vh}
    .dialog{min-height:250px;padding:14px 14px 16px}
    .dialog .line{font-size:14px;min-height:42px}
    .choice{font-size:12px;padding:9px 10px}
    .qhead{top:74px;left:12px;font-size:12px}
    .discuss{top:74px;right:12px;max-width:52%;font-size:11px}
    .narration .txt{font-size:17px}
    .narration .inner svg{height:min(34vh,240px)}
    .speech{top:34px;width:calc(100% - 28px);font-size:15px;padding:14px 16px}
    .ending-scene img{height:72%;max-width:78vw}
    #ending .who{bottom:86px;width:100%;font-size:17px}
    #ending .end-actions{bottom:24px;padding:0 12px}
  }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <section class="screen active" id="title">
    <div class="badge"><img src="assets/logo/yonsei_symbol.jpg" alt="연세대"><b>연세대학교 · 스무살 멘토링</b></div>
    <div class="heart">💗</div>
    <h1>스무살 멘토링 게임</h1>
    <div class="sub">검정 실루엣의 ‘나’로 시작하는<br>여고 대상 대학 멘토링 로맨스 시뮬레이션</div>
    <div class="title-btns">
      <button class="btn" onclick="go('main')">시작하기 ▶</button>
      <button class="btn ghost" onclick="openCards()">🃏 관점 카드</button>
    </div>
  </section>

  <!-- MAIN -->
  <section class="screen" id="main">
    <div class="topbar">
      <div class="brand"><img src="assets/logo/yonsei_symbol.jpg" alt="연세대"><div class="t"><b>연세대학교</b><span>TWENTY MENTORING GAME</span></div></div>
      <div class="consensus">✨ 스무살 로망도 <span id="conNum">0</span>/100<div class="bar"><i id="conBar"></i></div></div>
      <button class="btn ghost small" onclick="resetGame()">처음부터</button>
    </div>
    <div class="roster" id="roster"></div>
    <div class="fab">
      <button class="btn" onclick="openQuests()">📋 퀘스트</button>
      <button class="btn ghost" onclick="openStatus()">💬 상태창</button>
      <button class="btn navy" onclick="openCards()">🃏 관점카드</button>
    </div>
  </section>

  <!-- QUEST PLAY -->
  <section class="screen" id="play">
    <div class="stage">
      <div class="bg-illus" id="playBg"></div>
      <div class="qhead" id="qhead"></div>
      <div class="discuss" id="discuss"></div>
      <div class="scene-chars" id="sceneChars"></div>
      <div class="solo" id="soloFig" style="display:none"></div>
      <div class="narration" id="narration" onclick="continueQuest()"><div class="inner"><div id="narFig"></div><div class="txt" id="narText"></div><div class="hint">화면을 누르면 계속</div></div></div>
      <div class="dialog">
        <div class="who" id="dWho"></div>
        <div class="line" id="dLine"></div>
        <div class="choices" id="dChoices"></div>
      </div>
    </div>
  </section>

  <!-- ENDING -->
  <section class="screen" id="ending"></section>

  <!-- OVERLAYS -->
  <div class="overlay" id="ovStatus"><div class="panel"><button class="x" onclick="close_('ovStatus')">×</button><h2>💬 남주 소개</h2><div id="statusList"></div></div></div>

  <div class="overlay" id="ovQuest"><div class="panel"><button class="x" onclick="close_('ovQuest')">×</button>
    <h2>📋 스무살 로망 퀘스트</h2>
    <p style="font-size:13px;color:#a07;margin-top:-4px">각 퀘스트는 검정 실루엣 나레이션 → 상황 → 남주 선택지 순서로 진행됩니다. 마지막 축제 부스에서 고백 엔딩이 열립니다.</p>
    <div class="qlist" id="questList"></div></div></div>

  <div class="overlay" id="ovCards"><div class="panel"><button class="x" onclick="close_('ovCards')">×</button>
    <h2>🃏 우리 조 관점 카드</h2>
    <p style="font-size:13px;color:#a07;margin-top:-4px">6명이 한 장씩 뽑아요. 토론할 때 자기 카드 관점으로 말하면 모두가 발언하게 돼요.</p>
    <div class="pcards" id="pcardList"></div></div></div>

  <div class="toast" id="toast"></div>
</div>

<script>
const CHAR_IMG={hyeong:"assets/characters/jisung.png",jinha:"assets/characters/jinha.png",jisung:"assets/characters/seongho.png",chanhyung:"assets/characters/chanhyung.png"};
const CHARS=[

function close_(id){$(id).classList.remove('active');}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}
function renderMain(){const r=$('roster');r.innerHTML='';CHARS.forEach(c=>{const p=Math.min(100,aff[c.id]);const d=document.createElement('div');d.className='char';d.innerHTML=`${art(c.id)}<div class="name">${c.name}</div><div class="tag">${c.tag}</div><div class="aff"><i style="width:${p}%"></i></div><div class="aff-num">💗 ${aff[c.id]}/100</div>`;d.onclick=()=>openStatus();r.appendChild(d);});$('conNum').textContent=consensus;$('conBar').style.width=Math.min(100,consensus)+'%';}
function openStatus(){const b=$('statusList');b.innerHTML='';CHARS.forEach(c=>{const card=document.createElement('div');card.className='stat-card';card.innerHTML=`<img src="${CHAR_IMG[c.id]}" alt=""><div class="info"><b>${c.name}</b> · ${c.tag}<span class="mbti">${c.mbti}</span><br>${c.desc}<br><b>동아리</b> : ${c.club}<br><b>좋아하는 것</b> : ${c.like}<br><b>싫어하는 것</b> : ${c.dislike}<br><b>호감도</b> : 💗 ${aff[c.id]}/100</div>`;b.appendChild(card);});open_('ovStatus');}
function openCards(){const b=$('pcardList');b.innerHTML='';PCARDS.forEach(p=>{const d=document.createElement('div');d.className='pcard';d.innerHTML=`<b>${p.e} ${p.n}</b><br><p>${p.d}</p>`;b.appendChild(d);});open_('ovCards');}
function openQuests(){const l=$('questList');l.innerHTML='';QUESTS.forEach((q,i)=>{const lock=i>=unlocked;const it=document.createElement('div');it.className='qitem'+(done[q.id]?' done':'')+(lock?' lock':'');it.innerHTML=`<div class="ico">${lock?'🔒':q.ico}</div><div><div class="qt">${q.title}</div><div class="qd">${lock?'이전 퀘스트 완료 후 열림':q.sub}</div></div>`;it.onclick=()=>{if(lock){toast('앞 퀘스트부터 진행해줘 ✨');return;}close_('ovQuest');startQuest(q.id);};l.appendChild(it);});open_('ovQuest');}
function renderScene(active,mood="smile"){const s=$('sceneChars');s.innerHTML='';CHARS.forEach(c=>{const d=document.createElement('div');d.className='char'+(active&&active!==c.id?' dim':'')+(active===c.id?' mood-'+mood:'');d.innerHTML=`${art(c.id,active===c.id?mood:"smile")}<div class="name">${c.name}</div>`;s.appendChild(d);});}
function startQuest(qid){const q=QUESTS.find(x=>x.id===qid);cur={q};$('playBg').className='bg-illus';$('playBg').innerHTML=bgHTML(q.bg);$('qhead').textContent=`${q.ico} ${q.title}`;$('discuss').innerHTML=`<b>🗣️ 멘토링 포인트</b>${q.discuss}`;$('sceneChars').innerHTML='';$('soloFig').style.display='none';$('dWho').textContent='';$('dLine').textContent='';$('dChoices').innerHTML='';$('narFig').innerHTML=silhouette();$('narText').textContent=q.narration;$('narration').classList.add('active');go('play');}
function continueQuest(){$('narration').classList.remove('active');const q=cur.q;if(q.mode==="solo"){ $('sceneChars').innerHTML='';$('soloFig').style.display='';$('soloFig').innerHTML=silhouette();$('dWho').textContent=q.who;$('dLine').textContent=q.scene;const ch=$('dChoices');ch.innerHTML='';q.options.forEach(op=>{const b=document.createElement('button');b.className='choice';b.textContent=op[0];b.onclick=()=>pickSolo(op);ch.appendChild(b);});return;} $('soloFig').style.display='none';renderScene(null);$('dWho').textContent='상황';$('dLine').textContent=q.scene;const ch=$('dChoices');ch.innerHTML='';if(q.mode==="mapped"){q.options.forEach(op=>{const b=document.createElement('button');b.className='choice';b.textContent=op[2];b.onclick=()=>resolveMapped(op);ch.appendChild(b);});}else{CHARS.forEach(c=>{const line=q.lines[c.id];const b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${c.name}</b> — ${line[1]}`;b.onclick=()=>pickLead(c.id);ch.appendChild(b);});}}
function pickSolo(op){firstDream=op[0];$('dLine').textContent=op[1]+' 이 선택은 앞으로 “나의 첫 로망”으로 기억된다.';$('dChoices').innerHTML='';completeQuest(null,12);}
function resolveMapped(op){const [cid,mood,,result]=op;const c=CHARS.find(x=>x.id===cid);renderScene(cid,mood);$('dWho').textContent=c.name;$('dLine').textContent=result;$('dChoices').innerHTML='';aff[cid]=Math.min(100,aff[cid]+20);completeQuest(cid,14,20);}
function pickLead(cid){const q=cur.q,line=q.lines[cid],c=CHARS.find(x=>x.id===cid);renderScene(cid,line[0]);$('dWho').textContent=c.name;$('dLine').textContent=line[1];const ch=$('dChoices');ch.innerHTML='';if(q.lineup){const l=document.createElement('div');l.className='lineup';l.innerHTML='<div>오프닝</div><div>교내 밴드 · 진하 무대</div><div>18:00</div><div>인디/밴드 ______</div><div>19:30</div><div>힙합 ______</div><div>21:00</div><div>헤드라이너 ______</div><div>앵콜</div><div>다 같이 떼창곡 ______</div>';ch.appendChild(l);}q.choices[cid].forEach(op=>{const b=document.createElement('button');b.className='choice';b.textContent=op[1];b.onclick=()=>resolve(cid,op);ch.appendChild(b);});}
function resolve(cid,op){const q=cur.q,c=CHARS.find(x=>x.id===cid);renderScene(cid,op[0]);$('dWho').textContent=c.name;$('dLine').textContent=op[2];$('dChoices').innerHTML='';const gain=q.final?35:25;aff[cid]=Math.min(100,aff[cid]+gain);if(q.final){ending(cid);return;}completeQuest(cid,16,gain);}
function completeQuest(cid,conUp,gain=0){const q=cur.q;consensus=Math.min(100,consensus+conUp);const wasNew=!done[q.id];done[q.id]=true;const idx=QUESTS.findIndex(x=>x.id===q.id);if(wasNew&&idx+1>=unlocked&&unlocked<QUESTS.length)unlocked=idx+2;const ch=$('dChoices');const v=document.createElement('div');v.className='vote';const name=cid?CHARS.find(x=>x.id===cid).name:"나";v.innerHTML=`✨ 로망도 +${conUp}${cid?` · 💗 ${name} 호감도 +${gain}`:""}${firstDream?`<br>첫 로망 회상: ${firstDream}`:""}`;ch.appendChild(v);const b=document.createElement('button');b.className='btn';b.style.marginTop='8px';b.textContent='메인으로';b.onclick=()=>{renderMain();go('main');toast('다음 퀘스트가 열렸어요 ✨');};ch.appendChild(b);}
function ending(cid){const c=CHARS.find(x=>x.id===cid),conf={hyeong:"스무살 첫날부터 지금까지, 사실 계속 너였어요. 선배 말고, 남자친구로 있어도 될까요?",jinha:"나 이런 말 진짜 안 하는데… 너 아니면 안 되겠어. 나랑 사귀자.",jisung:"MT 때 못 한 말, 지금 할게. …나 너 오래전부터 좋아했어. 이번엔 기억해줘.",chanhyung:"너랑 있으면 매일이 축제야. 이 여름, 나랑 제대로 사귀자."}[cid];const e=$('ending');e.innerHTML=`<div class="ending-scene"><div class="speech"><span class="tag">✨ 스무살 로망도 ${consensus}/100 · 불꽃 아래 고백</span>${conf}</div><div class="char mood-shy">${art(cid,"shy")}</div><div class="who">${c.name} 엔딩 · 연세대학교 스무살 멘토링 💗</div><div class="end-actions"><button class="btn" onclick="toast('🎉 ${c.name}와 해피엔딩!')">헐… 나도 좋아해 💗</button><button class="btn ghost" onclick="resetGame()">처음부터</button></div></div>`;for(let i=0;i<16;i++){const h=document.createElement('div');h.className='fall';h.textContent=['💗','💕','💖','✨'][i%4];h.style.left=(Math.random()*100)+'%';h.style.animationDuration=(3+Math.random()*3)+'s';h.style.animationDelay=(Math.random()*2)+'s';e.appendChild(h);}go('ending');}
function resetGame(){aff={hyeong:0,jinha:0,jisung:0,chanhyung:0};consensus=0;unlocked=1;firstDream="";done={};renderMain();go('title');}
renderMain();
const preview=new URLSearchParams(location.search).get('preview');if(preview==="main")go("main");else if(QUESTS.some(q=>q.id===preview))startQuest(preview);
</script>
</body>
