<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠퍼스 로맨스 · 미연시 프로토타입</title>
<style>
  :root{
    --pink:#ff7eb3; --pink-d:#ff4f8b; --cream:#fff6fb; --ink:#3a2b39;
    --card:#ffffff; --shadow:0 10px 30px rgba(255,79,139,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink);
    background:#fff6fb;
    min-height:100vh;
    overflow:hidden;
  }
  #app{
    width:100vw;height:100vh;
    background:var(--cream);border-radius:0;box-shadow:none;
    position:relative;overflow:hidden;display:flex;flex-direction:column;
  }
  .screen{position:absolute;inset:0;display:none;flex-direction:column;animation:fade .4s ease}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- TITLE ---------- */
  #title{align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(circle at 50% 30%,#fff 0%,#ffe3f1 70%);}
  #title h1{font-size:clamp(32px,6vw,52px);margin:.2em 0;
    background:linear-gradient(90deg,var(--pink-d),#ff9a5a);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;letter-spacing:-1px}
  #title p{color:#a06;opacity:.8;margin:.2em 0 1.6em;font-size:15px}
  .heart{font-size:60px;animation:beat 1.2s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

  /* ---------- BUTTONS ---------- */
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;
    background:linear-gradient(90deg,var(--pink),var(--pink-d));color:#fff;
    padding:14px 30px;border-radius:40px;font-size:16px;box-shadow:var(--shadow);
    transition:transform .12s}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:#fff;color:var(--pink-d);border:2px solid var(--pink)}
  .btn.small{padding:10px 18px;font-size:14px}

  /* ---------- MAIN ---------- */
  #main{background:
      linear-gradient(180deg,rgba(255,255,255,.48) 0%,rgba(255,247,251,.55) 52%,rgba(255,246,251,.9) 100%),
      url("assets/backgrounds/yonsei_main.png") center/cover no-repeat;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:24px 34px;z-index:3}
  .topbar .logo{font-weight:900;color:var(--pink-d);font-size:18px}
  .yonsei-brand{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.88);
    border:1.5px solid rgba(0,65,130,.16);border-radius:999px;padding:8px 14px;box-shadow:0 8px 22px rgba(0,38,84,.12)}
  .yonsei-mark{width:34px;height:34px;border-radius:50%;background:#003876;color:#fff;
    display:grid;place-items:center;font-weight:950;font-family:Georgia,serif}
  .yonsei-text{display:flex;flex-direction:column;line-height:1.05}
  .yonsei-text b{color:#003876;font-size:15px}
  .yonsei-text span{color:#49627e;font-size:10px;font-weight:800;letter-spacing:.06em}
  .roster{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:26px;padding:92px 150px 92px 70px;overflow:hidden}
  .char{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;
    cursor:pointer;transition:transform .18s;position:relative}
  .char:hover{transform:translateY(-8px)}
  .char svg,.char img{width:100%;height:auto;max-height:68vh;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(0,0,0,.18))}
  .char .name{font-weight:900;margin-top:4px;font-size:15px;color:#2d2430;text-shadow:0 1px 0 rgba(255,255,255,.9)}
  .char .tag{font-size:11px;color:#885b7a;margin-bottom:5px;font-weight:800}
  .aff{width:86%;height:12px;background:#ffdfec;border-radius:10px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.65)}
  .aff > i{display:block;height:100%;width:0;border-radius:10px;
    background:linear-gradient(90deg,#ff9ec4,var(--pink-d));transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .aff-num{font-size:11px;color:var(--pink-d);font-weight:800;margin:2px 0 0}
  .fab{position:absolute;right:34px;bottom:146px;display:flex;flex-direction:column;gap:12px;z-index:4}

  /* ---------- MODAL ---------- */
  .overlay{position:absolute;inset:0;background:rgba(58,43,57,.45);display:none;
    align-items:center;justify-content:center;padding:18px;z-index:20}
  .overlay.active{display:flex;animation:fade .25s}
  .panel{background:#fff;width:100%;max-width:640px;max-height:88%;overflow:auto;
    border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  .panel h2{margin:.1em 0 .6em;color:var(--pink-d)}
  .x{float:right;border:none;background:#ffe3f1;color:var(--pink-d);width:34px;height:34px;
    border-radius:50%;font-size:18px;cursor:pointer;font-weight:800}

  /* status cards */
  .stat-card{display:flex;gap:14px;background:#fff6fb;border:1.5px solid #ffe0ee;
    border-radius:16px;padding:12px;margin-bottom:12px}
  .stat-card svg,.stat-card img{width:96px;max-height:150px;height:auto;flex-shrink:0;object-fit:contain}
  .stat-card .info{font-size:13px;line-height:1.55}
  .stat-card .info b{color:var(--pink-d)}
  .mbti{display:inline-block;background:var(--pink);color:#fff;border-radius:8px;
    padding:1px 8px;font-size:12px;font-weight:800;margin-left:6px}
  .dm-btn{margin-top:8px;border:none;border-radius:999px;padding:8px 14px;background:#003876;color:#fff;
    font-family:inherit;font-weight:900;cursor:pointer}
  .dm-box{display:flex;flex-direction:column;gap:10px;min-height:260px}
  .dm-log{background:#f7f9ff;border:1.5px solid #dce8ff;border-radius:16px;padding:12px;
    min-height:180px;max-height:310px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .bubble{max-width:78%;padding:9px 12px;border-radius:16px;font-size:13px;line-height:1.45}
  .bubble.me{align-self:flex-end;background:#ff7eb3;color:#fff;border-bottom-right-radius:4px}
  .bubble.him{align-self:flex-start;background:#fff;color:#322;border:1px solid #e8def0;border-bottom-left-radius:4px}
  .dm-input{display:flex;gap:8px}
  .dm-input input{flex:1;border:1.5px solid #ffcfe4;border-radius:999px;padding:12px 14px;font-family:inherit}

  /* quests */
  .qlist{display:grid;grid-template-columns:1fr;gap:10px}
  .qitem{display:flex;align-items:center;gap:12px;background:#fff6fb;border:1.5px solid #ffe0ee;
    border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s}
  .qitem:hover{background:#ffe9f4;transform:translateX(4px)}
  .qitem .ico{font-size:26px}
  .qitem .qt{font-weight:800;font-size:15px}
  .qitem .qd{font-size:12px;color:#a07}
  .qitem.done{opacity:.5}
  .qitem.done::after{content:'완료 ✓';margin-left:auto;color:#7bbf6a;font-weight:800;font-size:12px}

  /* ---------- QUEST PLAY ---------- */
  #play{background:linear-gradient(160deg,#cfe8ff,#ffe9f4)}
  .stage{flex:1;position:relative;overflow:hidden}
  .bg-illus{position:absolute;inset:0;z-index:0}
  .bg-illus img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;opacity:.95}
  .bg-illus::after{content:"";position:absolute;inset:0;background:rgba(255,252,254,.12);pointer-events:none}
  .scene-chars{position:absolute;bottom:230px;left:0;right:0;display:flex;justify-content:center;
    gap:2%;z-index:1;padding:0 4%;transition:.3s}
  .scene-chars .char{max-width:190px}
  .scene-chars .char svg,.scene-chars .char img{max-height:44vh}
  .scene-chars .char.dim{opacity:.35;filter:grayscale(.4)}
  .scene-chars .char .name{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .dialog{position:absolute;left:0;right:0;bottom:0;z-index:5;
    background:rgba(255,255,255,.96);border-top:3px solid var(--pink);
    padding:16px 20px 18px;min-height:150px}
  .dialog .who{font-weight:900;color:var(--pink-d);margin-bottom:4px}
  .dialog .line{font-size:15px;line-height:1.6;min-height:48px}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .choice{text-align:left;background:#fff6fb;border:1.5px solid #ffcfe4;border-radius:12px;
    padding:11px 14px;cursor:pointer;font-family:inherit;font-size:14px;transition:.15s}
  .choice:hover{background:#ffe3f1;border-color:var(--pink)}
  .qhead{position:absolute;top:12px;left:14px;z-index:5;background:rgba(255,255,255,.9);
    border-radius:30px;padding:6px 16px;font-weight:800;color:var(--pink-d);font-size:13px}

  /* ---------- ENDING ---------- */
  #ending{background:
      linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,230,244,.78)),
      url("assets/backgrounds/yonsei_confession.png") center/cover no-repeat;
    align-items:center;justify-content:flex-end;text-align:center;padding:0;overflow:hidden}
  .ending-scene{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
  .ending-scene img{height:82%;max-height:600px;width:auto;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(0,0,0,.22))}
  .speech{position:absolute;top:54px;left:50%;transform:translateX(-50%);max-width:520px;
    background:rgba(255,255,255,.96);border:3px solid var(--pink);border-radius:24px;padding:18px 22px;
    color:#5a2444;font-size:18px;line-height:1.65;font-weight:800;box-shadow:var(--shadow)}
  .speech:after{content:"";position:absolute;bottom:-18px;left:50%;border-width:18px 14px 0 14px;border-style:solid;
    border-color:var(--pink) transparent transparent transparent}
  #ending .who{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.45)}
  #ending .end-actions{position:absolute;bottom:24px;left:0;right:0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .fall{position:absolute;top:-30px;font-size:22px;animation:fall linear infinite;z-index:0}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

  .toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:30;
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;
    font-size:14px;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1;top:70px}
  @media(max-width:560px){
    .char .tag{display:none}
    .stat-card{flex-direction:column;align-items:center;text-align:center}
  }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <section class="screen active" id="title">
    <div class="heart">💗</div>
    <h1>캠퍼스 로맨스</h1>
    <p>설레는 대학 생활, 네 명의 그 사람 중 누구와 이어질까?</p>
    <button class="btn" onclick="go('main')">게임 시작 ▶</button>
  </section>

  <!-- MAIN -->
  <section class="screen" id="main">
    <div class="topbar">
      <div class="yonsei-brand" aria-label="연세대학교">
        <div class="yonsei-mark">Y</div>
        <div class="yonsei-text"><b>연세대학교</b><span>YONSEI CAMPUS ROMANCE</span></div>
      </div>
      <button class="btn ghost small" onclick="resetGame()">처음부터</button>
    </div>
    <div class="roster" id="roster"></div>
    <div class="fab">
      <button class="btn" onclick="openQuests()">📋 퀘스트</button>
      <button class="btn ghost" onclick="openStatus()">💬 상태창</button>
      <button class="btn" onclick="openDMPicker()" style="background:linear-gradient(90deg,#3a6fd8,#003876)">💌 DM</button>
    </div>
  </section>

  <!-- QUEST PLAY -->
  <section class="screen" id="play">
    <div class="stage">
      <div class="bg-illus" id="playBg"></div>
      <div class="qhead" id="qhead"></div>
      <div class="scene-chars" id="sceneChars"></div>
      <div class="dialog">
        <div class="who" id="dWho"></div>
        <div class="line" id="dLine"></div>
        <div class="choices" id="dChoices"></div>
      </div>
    </div>
  </section>

  <!-- ENDING -->
  <section class="screen" id="ending"></section>

  <!-- OVERLAYS -->
  <div class="overlay" id="ovStatus">
    <div class="panel">
      <button class="x" onclick="close_('ovStatus')">×</button>
      <h2>💬 상태창 · 남주 소개</h2>
      <div id="statusList"></div>
    </div>
  </div>

  <div class="overlay" id="ovQuest">
    <div class="panel">
      <button class="x" onclick="close_('ovQuest')">×</button>
      <h2>📋 퀘스트</h2>
      <p style="font-size:13px;color:#a07;margin-top:-4px">퀘스트는 순서대로 열려요. 하나 끝내면 다음 퀘스트가 알림으로 짠! 하고 생깁니다. (100 달성 시 고백 엔딩!)</p>
      <div class="qlist" id="questList"></div>
    </div>
  </div>

  <div class="overlay" id="ovDMPick">
    <div class="panel">
      <button class="x" onclick="close_('ovDMPick')">×</button>
      <h2>💌 누구에게 DM 보낼까?</h2>
      <div id="dmPickList" class="qlist"></div>
    </div>
  </div>

  <div class="overlay" id="ovDM">
    <div class="panel">
      <button class="x" onclick="close_('ovDM')">×</button>
      <h2 id="dmTitle">💌 DM</h2>
      <div class="dm-box">
        <div class="dm-log" id="dmLog"></div>
        <div class="dm-input">
          <input id="dmText" placeholder="메시지 입력하기" onkeydown="if(event.key==='Enter')sendDM()">
          <button class="btn small" onclick="sendDM()">보내기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   캐릭터 SVG 아트 (오리지널 · 웹툰풍 스타일)
   ※ 실제 일러스트로 교체 시 이 함수의 반환값만 <img>로 바꾸면 됨
   ============================================================ */
/* ▼▼▼ 실제 일러스트를 넣으려면 여기 경로만 채우세요 ▼▼▼
   - HTML 파일과 같은 폴더에 'images' 폴더를 만들고 그 안에 그림을 넣으면 됩니다.
   - 투명 배경 PNG를 권장합니다. 비워두면("") 기존 SVG가 그대로 쓰입니다. */
const CHAR_IMG={
  seojun: "assets/characters/seojun.png",
  taeo:   "assets/characters/taeo.png",
  haneul: "assets/characters/haneul.png",
  doyoon: "assets/characters/doyoon.png"
};
/* ▲▲▲ 여기까지만 수정하면 그림이 교체됩니다 ▲▲▲ */

function art(id){
  if(CHAR_IMG[id]){
    return `<img src="${CHAR_IMG[id]}" alt="${id}">`;
  }
  const A={
  // 1) 서준 — 다정, 내림머리, 훈훈, 따뜻한 톤
  seojun:`<svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="s_sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6d2"/><stop offset="1" stop-color="#ffd6bd"/></linearGradient></defs>
    <path d="M55 320 Q60 235 100 232 Q140 235 145 320Z" fill="#f4c98a"/>
    <path d="M60 320 Q65 250 100 246 Q135 250 140 320Z" fill="#fbe3c0"/>
    <rect x="92" y="205" width="16" height="34" rx="7" fill="url(#s_sk)"/>
    <ellipse cx="100" cy="150" rx="52" ry="58" fill="url(#s_sk)"/>
    <path d="M64 108 Q100 60 136 108 Q140 132 128 150 Q126 118 100 112 Q74 118 72 150 Q60 132 64 108Z" fill="#7a4b2b"/>
    <path d="M64 110 Q78 96 96 104 Q84 120 78 140 Q66 128 64 110Z" fill="#8a5734"/>
    <path d="M104 104 Q122 96 136 110 Q134 128 122 140 Q116 120 104 104Z" fill="#8a5734"/>
    <path d="M72 150 Q73 122 100 116 Q127 122 128 150 Q118 128 100 126 Q82 128 72 150Z" fill="#6b3f22"/>
    <path d="M78 138 q10 -6 20 0" stroke="#6b3f22" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M102 138 q10 -6 20 0" stroke="#6b3f22" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="86" cy="152" rx="6.5" ry="8" fill="#5b3a26"/><circle cx="88" cy="150" r="2" fill="#fff"/>
    <ellipse cx="114" cy="152" rx="6.5" ry="8" fill="#5b3a26"/><circle cx="116" cy="150" r="2" fill="#fff"/>
    <ellipse cx="76" cy="166" rx="7" ry="4" fill="#ffb59b" opacity=".6"/>
    <ellipse cx="124" cy="166" rx="7" ry="4" fill="#ffb59b" opacity=".6"/>
    <path d="M99 156 l-3 8 h6Z" fill="#eab38f"/>
    <path d="M88 178 q12 10 24 0" stroke="#c86b4f" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`,
  // 2) 태오 — 나쁜남자, 올림머리, 강한 인상, 쿨톤
  taeo:`<svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="t_sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3cf"/><stop offset="1" stop-color="#f6ccb0"/></linearGradient></defs>
    <path d="M50 320 Q55 232 100 228 Q145 232 150 320Z" fill="#2b2b33"/>
    <path d="M74 232 L100 262 L126 232 L118 320 H82Z" fill="#3a3a45"/>
    <path d="M92 208 h16 v30 l-8 8 -8 -8Z" fill="url(#t_sk)"/>
    <ellipse cx="100" cy="150" rx="51" ry="57" fill="url(#t_sk)"/>
    <path d="M62 118 Q70 66 100 70 Q130 66 138 118 Q120 96 100 96 Q80 96 62 118Z" fill="#17171c"/>
    <path d="M64 116 Q88 84 100 96 Q78 100 70 128 Q64 124 64 116Z" fill="#0e0e12"/>
    <path d="M136 116 Q112 84 100 96 Q122 100 130 128 Q136 124 136 116Z" fill="#0e0e12"/>
    <path d="M74 128 q12 -3 22 3" stroke="#1b1b20" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M104 131 q10 -6 22 -3" stroke="#1b1b20" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M76 150 q10 -4 19 -1" stroke="#3a2a24" stroke-width="2" fill="none"/>
    <ellipse cx="85" cy="150" rx="6" ry="7" fill="#4a2f3a"/><circle cx="87" cy="148" r="1.8" fill="#fff"/>
    <ellipse cx="115" cy="150" rx="6" ry="7" fill="#4a2f3a"/><circle cx="117" cy="148" r="1.8" fill="#fff"/>
    <path d="M98 154 l-3 9 h6Z" fill="#e0a683"/>
    <path d="M86 176 q14 6 26 -2" stroke="#a84e4e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M132 156 l7 -3 -4 7Z" fill="#c0c0c8"/>
  </svg>`,
  // 3) 하늘 — 엉뚱, 스트릿 패션, 개성, 밝은 애쉬 헤어 + 비니
  haneul:`<svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="h_sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6d4"/><stop offset="1" stop-color="#ffd3ba"/></linearGradient></defs>
    <path d="M48 320 Q52 236 100 232 Q148 236 152 320Z" fill="#8a5cff"/>
    <path d="M70 236 Q100 224 130 236 L124 300 H76Z" fill="#b39aff"/>
    <circle cx="100" cy="270" r="6" fill="#fff"/><circle cx="100" cy="292" r="6" fill="#fff"/>
    <rect x="92" y="207" width="16" height="30" rx="7" fill="url(#h_sk)"/>
    <ellipse cx="100" cy="150" rx="51" ry="57" fill="url(#h_sk)"/>
    <path d="M66 122 Q72 80 100 84 Q128 80 134 122 Q116 104 100 106 Q84 104 66 122Z" fill="#cfd6e4"/>
    <path d="M78 118 l6 14 6 -12 6 14 6 -12 6 12" stroke="#aeb7cc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M56 74 Q100 52 144 74 Q150 96 144 104 Q100 88 56 104 Q50 96 56 74Z" fill="#ff5aa5"/>
    <rect x="54" y="98" width="92" height="12" rx="6" fill="#ff8dc2"/>
    <path d="M76 132 q9 -4 18 0" stroke="#8a93a8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M106 132 q9 -4 18 0" stroke="#8a93a8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="85" cy="150" r="7.5" fill="#4a7bd0"/><circle cx="87" cy="148" r="2.4" fill="#fff"/>
    <circle cx="115" cy="150" r="7.5" fill="#4a7bd0"/><circle cx="117" cy="148" r="2.4" fill="#fff"/>
    <ellipse cx="74" cy="165" rx="7" ry="4" fill="#ffb59b" opacity=".6"/>

/* ============================================================
   상태 & 로직
   ============================================================ */
let affinity={seojun:0,taeo:0,haneul:0,doyoon:0};
let doneQuests={};
let cur={};  // 진행 중 퀘스트 상태

const $=id=>document.getElementById(id);
function go(s){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(s).classList.add('active');}
function open_(id){$(id).classList.add('active');}
function close_(id){$(id).classList.remove('active');}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}

/* 메인 화면 렌더 */
function renderMain(){
  const r=$('roster');r.innerHTML='';
  CHARS.forEach(c=>{
    const pct=Math.min(100,affinity[c.id]);
    const d=document.createElement('div');
    d.className='char';
    d.innerHTML=`${art(c.id)}
      <div class="name">${c.name}</div>
      <div class="tag">${c.tag}</div>
      <div class="aff"><i style="width:${pct}%"></i></div>
      <div class="aff-num">💗 ${affinity[c.id]} / 100</div>`;
    d.onclick=()=>{openStatus(c.id);};
    r.appendChild(d);
  });
}

/* 상태창 */
function openStatus(focus){
  const box=$('statusList');box.innerHTML='';
  CHARS.forEach(c=>{
    const card=document.createElement('div');
    card.className='stat-card';
    card.innerHTML=`<div>${art(c.id)}</div>
      <div class="info">
        <b>${c.name}</b> · ${c.tag}<span class="mbti">${c.mbti}</span><br>
        ${c.desc}<br>
        <b>좋아하는 것</b> : ${c.like}<br>
        <b>싫어하는 것</b> : ${c.dislike}<br>
        <b>현재 호감도</b> : 💗 ${affinity[c.id]} / 100
      </div>`;
    box.appendChild(card);
  });
  open_('ovStatus');
}

/* 퀘스트 목록 */
function openQuests(){
  const list=$('questList');list.innerHTML='';
  QUESTS.forEach(q=>{
    const it=document.createElement('div');
    it.className='qitem'+(doneQuests[q.id]?' done':'');
    it.innerHTML=`<div class="ico">${q.ico}</div>
      <div><div class="qt">${q.title}</div><div class="qd">${q.sub}</div></div>`;
    it.onclick=()=>{close_('ovQuest');startQuest(q.id);};
    list.appendChild(it);
  });
  open_('ovQuest');
}

/* 퀘스트 시작 → 상황 제시 */
function startQuest(qid){
  const q=QUESTS.find(x=>x.id===qid);
  cur={q,step:'situation',picked:null};
  $('playBg').innerHTML=bg(q.bg);
  $('qhead').textContent=`${q.ico} ${q.title}`;
  renderScene(null);
  $('dWho').textContent='상황';
  $('dLine').textContent=q.scene;
  const ch=$('dChoices');ch.innerHTML='';
  CHARS.forEach(c=>{
    const b=document.createElement('button');
    b.className='choice';
    b.innerHTML=`<b>${c.name}</b> — ${q.lines[c.id]}`;
    b.onclick=()=>pickChar(c.id);
    ch.appendChild(b);
  });
  go('play');
}

/* 무대 위 캐릭터 (선택 시 나머지 흐리게) */
function renderScene(active){
  const s=$('sceneChars');s.innerHTML='';
  CHARS.forEach(c=>{
    const d=document.createElement('div');
    d.className='char'+(active&&active!==c.id?' dim':'');
    d.innerHTML=`${art(c.id)}<div class="name">${c.name}</div>`;
    s.appendChild(d);
  });
}

/* 남주 선택 → 개별 선택지 */
function pickChar(cid){
  const q=cur.q;cur.picked=cid;
  renderScene(cid);
  const c=CHARS.find(x=>x.id===cid);
  $('dWho').textContent=c.name;
  $('dLine').textContent=q.lines[cid];
  const ch=$('dChoices');ch.innerHTML='';
  q.choices[cid].forEach(opt=>{
    const b=document.createElement('button');
    b.className='choice';
    b.textContent=opt.t;
    b.onclick=()=>resolveChoice(cid,opt);
    ch.appendChild(b);
  });
}

/* 선택 결과 → 호감도 반영 */
function resolveChoice(cid,opt){
  const c=CHARS.find(x=>x.id===cid);
  $('dWho').textContent=c.name;
  $('dLine').textContent=opt.r;
  affinity[cid]=Math.min(100,affinity[cid]+opt.p);
  doneQuests[cur.q.id]=true;
  const ch=$('dChoices');ch.innerHTML='';
  const b=document.createElement('button');
  b.className='btn';b.style.marginTop='6px';
  b.textContent=`💗 +${opt.p}  ·  메인으로`;
  b.onclick=()=>{
    if(affinity[cid]>=100){ ending(cid); }
    else { renderMain(); go('main'); toast(`${c.name} 호감도 +${opt.p}!`); }
  };
  ch.appendChild(b);
}

/* 엔딩 */
function ending(cid){
  const c=CHARS.find(x=>x.id===cid);
  const conf={
   seojun:'"…나 사실, OT 첫날부터 너만 눈에 들어왔어요. 이제 선배 말고, 남자친구로 옆에 있어도 될까요?"',
   taeo:'"나 이런 말 잘 안 하는 거 알지. …너 아니면 안 되겠어. 나랑, 사귀자."',
   haneul:'"내 모든 그림에 요즘 너만 그려. 너는 내 뮤즈야 — 우리, 연인 하자! 어때?!"',
   doyoon:'"농담 다 빼고 딱 한 마디만 할게. …좋아해. 웃음 말고 설렘도 내가 책임질게, 나랑 만나자."'
  }[cid];
  const e=$('ending');
  e.innerHTML=`${art(cid)}
    <div class="who">${c.name} 엔딩 · 💗 100</div>
    <div class="conf">${conf}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn" onclick="acceptEnd('${c.name}')">"응, 나도 좋아해요" 💗</button>
      <button class="btn ghost" onclick="resetGame()">처음부터</button>
    </div>`;
  // 하트 낙하 연출
  for(let i=0;i<16;i++){
    const h=document.createElement('div');h.className='fall';
    h.textContent=['💗','💕','💖','✨'][i%4];
    h.style.left=(Math.random()*100)+'%';
    h.style.animationDuration=(3+Math.random()*3)+'s';
    h.style.animationDelay=(Math.random()*2)+'s';
    e.appendChild(h);
  }
  go('ending');
}

function acceptEnd(name){
  toast(`🎉 ${name}와 연애 성공! 축하해요!`);
}

function resetGame(){
  affinity={seojun:0,taeo:0,haneul:0,doyoon:0};
  doneQuests={};
  renderMain();
  go('title');
}

/* 초기화 */
renderMain();
const previewMode=new URLSearchParams(location.search).get('preview');
if(previewMode==='main'){
  go('main');
}else if(QUESTS.some(q=>q.id===previewMode)){
  startQuest(previewMode);
}

/* ============================================================
   💌 DM 대화 엔진
   API 키는 브라우저에 두지 않는다! 백엔드 프록시(/api/dm)가
   서버 환경변수의 키로 LLM 을 호출하고 결과만 돌려준다.
   → 로컬/배포 모두 `node server.js` 로 실행해야 DM AI 가 켜진다.

const DM_ENDPOINT = "/api/dm";

  doneQuests[cur.q.id]=true;
  if(wasNew && qIndex+1>=unlockedQuestCount && unlockedQuestCount<QUESTS.length){

  }
  const ch=$("dChoices");ch.innerHTML="";
  const b=document.createElement("button");

      renderMain();go("main");

}

async function sendDM(){
  const input=$("dmText");
  const text=input.value.trim();
  if(!text||!dmTarget)return;
  const cid=dmTarget;
  dmHistory[cid].push({from:"me",text});
  input.value="";
  renderDM();

  // 상대가 타이핑 중… 표시
  const log=$("dmLog");
  const typing=document.createElement("div");
  typing.className="bubble him";
  typing.textContent="입력 중…";
  log.appendChild(typing);
  log.scrollTop=log.scrollHeight;

  let reply, aiFailed=false;
  try{
    reply = await aiReply(cid);               // 백엔드 프록시(/api/dm) 호출
  }catch(e){
    console.warn("[DM] AI 호출 실패 → 오프라인 응답으로 대체:", e.message);
    aiFailed=true;
    reply = personaReply(cid,text);           // 서버 미실행/오류 시 규칙기반 폴백
  }
  typing.remove();
  if(aiFailed){
    dmHistory[cid].push({from:"him",text:"⚠️ 서버 미연결 — `node server.js` 로 실행했는지 확인해줘 (지금은 오프라인 응답)"});
  }

  // 실제 카톡처럼 1~3개의 짧은 말풍선으로 분할
  const parts = String(reply)
    .split(/\n+|(?<=[.?!~ㅋㅎ])\s+(?=\S)/)
    .map(s=>s.trim()).filter(Boolean).slice(0,3);
  (parts.length?parts:[String(reply)]).forEach(p=>dmHistory[cid].push({from:"him",text:p}));
  renderDM();
}

/* 진짜 LLM 응답 — 키는 서버에만. 브라우저는 프록시(/api/dm)만 호출한다. */
async function aiReply(cid){
  const history=dmHistory[cid].slice(-10).map(m=>({from:m.from,text:m.text}));
  const res=await fetch(DM_ENDPOINT,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({cid,affinity:affinity[cid]||0,history})
  });
  const data=await res.json().catch(()=>({error:"invalid response"}));
  if(!res.ok) throw new Error(data.error||("proxy "+res.status));
  return String(data.reply||"").trim();
}

/* 오프라인 폴백 — API 키가 없을 때 쓰는 규칙기반 응답.
   ※ 진짜 대화(맥락 이해)가 아니라, 키워드로 분류해 여러 후보 중 랜덤으로 고르는 방식.
      자연스러운 대화를 원하면 `node server.js` 로 백엔드를 실행하세요(.env 에 키 설정). */
const lastReply={seojun:"",taeo:"",haneul:"",doyoon:""};
function pick(cid,arr){
  const cands=arr.filter(Boolean);
  let choice=cands[Math.floor(Math.random()*cands.length)];
  // 방금 보낸 답과 같으면 한 번 더 뽑아 반복 회피
  if(cands.length>1 && choice===lastReply[cid]){
    choice=cands[(cands.indexOf(choice)+1)%cands.length];
  }
  lastReply[cid]=choice;
  return choice;
}

      ask:["나 지금 새벽 편의점ㅋㅋ 너는 뭐해?","오 궁금한 거 많네 좋아 좋아!","그거 물어봐 줘서 완전 신남ㅋㅋ"],
      def:["나 지금 답장하면서 실실 웃는 중ㅋㅋ","너 톡 말투 왜 이렇게 재밌냐","방금 너 닮은 색 조합 찾음 🎨","우리 다음에 뭐 재밌는 거 하자!"]
    },
    doyoon:{
      tired:["힘들었어? 내 개그 무료 이용권 줄게.","근데 진지하게, 너 괜찮아?","오늘은 내가 웃겨줄 테니까 기운 내라."],
      crush:["오… 방금 멘트 위험했다.","나 장난으로 못 넘길 수도 있는데?","야, 그런 말 하면 나 진심 된다?"],
      quest:["콜. 나 분위기, 너 중심. 우승 조합.","그거 나만 믿어봐 ㅋㅋ","같이 하면 A+ 냄새 난다니까?"],
      ask:["나? 축구 끝나고 치맥 각 보는 중ㅋㅋ 너는?","오 질문 좋아, 계속 물어봐~","궁금한 거 있으면 다 풀어줌ㅋㅋ"],
      def:["메시지 확인 완료~","근데 네 톡 오면 왜 자동으로 웃기지?","오늘 뭐 재밌는 일 없었어?","심심했지? 내가 왔으니 됐고~"]
    }
  }[cid];
  if(tired) return pick(cid,BANK.tired);
  if(crush) return pick(cid,BANK.crush);
  if(quest) return pick(cid,BANK.quest);
  if(ask)   return pick(cid,BANK.ask);
  return pick(cid,BANK.def);
}

function ending(cid){
  const c=CHARS.find(x=>x.id===cid);
  const conf={
   seojun:"처음부터 지금까지, 내 시선은 계속 너한테 있었어요. 선배 말고 남자친구로 옆에 있어도 될까요?",
   taeo:"나 이런 말 진짜 안 하는데… 너 아니면 안 되겠어. 나랑 사귀자.",
   haneul:"내 스케치북에 요즘 너만 있어. 그러니까 내 진짜 뮤즈가 되어주라!",
   doyoon:"장난 다 빼고 말할게. 나 너 좋아해. 앞으로 네 웃음도 설렘도 내가 책임지고 싶어."
  }[cid];
  const e=$("ending");
  e.innerHTML=`<div class="ending-scene">
      <div class="speech">${conf}</div>
      ${art(cid)}
      <div class="who">${c.name} 엔딩 · 연세대 캠퍼스 고백 · 💗 100</div>
      <div class="end-actions">
        <button class="btn" onclick="acceptEnd('${c.name}')">헐… 나도 좋아해 💗</button>
        <button class="btn ghost" onclick="resetGame()">처음부터</button>
      </div>
    </div>`;
  for(let i=0;i<16;i++){
    const h=document.createElement("div");h.className="fall";
    h.textContent=["💗","💕","💖","✨"][i%4];
    h.style.left=(Math.random()*100)+"%";
    h.style.animationDuration=(3+Math.random()*3)+"s";
    h.style.animationDelay=(Math.random()*2)+"s";
    e.appendChild(h);
  }
  go("ending");
}

function resetGame(){
  affinity={seojun:0,taeo:0,haneul:0,doyoon:0};
  doneQuests={};
  unlockedQuestCount=1;
  Object.keys(dmHistory).forEach(k=>dmHistory[k]=[]);
  renderMain();
  go("title");
}

renderMain();
const previewMode2=new URLSearchParams(location.search).get("preview");
if(previewMode2==="main"){go("main");}
else if(previewMode2==="ending"){affinity.seojun=100;ending("seojun");}
else if(previewMode2==="quests"){go("main");openQuests();}
else if(previewMode2==="dm"){go("main");openDM("doyoon");}
else if(QUESTS.some(q=>q.id===previewMode2)){startQuest(previewMode2);}
</script>
